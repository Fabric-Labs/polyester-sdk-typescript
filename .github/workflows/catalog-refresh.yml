name: Catalog Refresh

on:
  workflow_dispatch:

jobs:
  refresh:
    name: Refresh testnet catalogs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh testnet catalogs
        run: bun run refresh:catalogs:testnet

      - name: Check formatting
        run: bun run format:check

      - name: Type-check
        run: bun run check

      - name: Check catalogs
        run: bun run check:catalogs

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Open catalog refresh PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: catalog/refresh-testnet
          delete-branch: true
          add-paths: |
            src/catalogs/market-data-catalog.generated.ts
            src/catalogs/zipper-catalog.generated.ts
          title: "chore: refresh testnet catalogs"
          commit-message: "chore: refresh testnet catalogs"
          body: "Refreshes the checked-in testnet catalog snapshots from the live testnet APIs."
