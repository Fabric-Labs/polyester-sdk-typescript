name: Release Polyester SDK

on:
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: write
    id-token: write
    pull-requests: write

concurrency:
    group: release-polyester-sdk-main
    cancel-in-progress: false

jobs:
    release:
        name: Create release pull request or publish
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  fetch-depth: 0

            - name: Validate manual release ref
              if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
              run: |
                  echo "workflow_dispatch is only allowed from main"
                  exit 1

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version-file: .node-version
                  registry-url: https://registry.npmjs.org

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Validate npm trusted publishing support
              run: |
                  NPM_VERSION=$(npm --version)
                  echo "npm $NPM_VERSION"
                  node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)' "$NPM_VERSION"

            - name: Verify generated descriptors are stripped
              run: |
                  bun scripts/strip-descriptor-options.ts
                  git diff --exit-code -- src/gen

            - name: Check SDK
              run: bun run ci

            - name: Validate package contents
              run: npm pack --dry-run --ignore-scripts

            - name: Create release pull request or publish to npm
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
              with:
                  commit: "chore(release): version polyester sdk"
                  title: "chore(release): version polyester sdk"
                  version: bun run version-packages
                  publish: bun run release
                  commitMode: github-api
                  createGithubReleases: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
