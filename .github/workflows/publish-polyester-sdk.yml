name: Release Polyester SDK

on:
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: write
    id-token: write
    pull-requests: write

concurrency:
    group: release-polyester-sdk-main
    cancel-in-progress: false

jobs:
    release:
        name: Create release pull request or publish
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  fetch-depth: 0

            - name: Validate manual release ref
              if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
              run: |
                  echo "workflow_dispatch is only allowed from main"
                  exit 1

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version-file: .node-version
                  registry-url: https://registry.npmjs.org

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Validate npm trusted publishing support
              run: |
                  NPM_VERSION=$(npm --version)
                  echo "npm $NPM_VERSION"
                  node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)' "$NPM_VERSION"

            - name: Verify generated descriptors are stripped
              run: |
                  bun scripts/strip-descriptor-options.ts
                  git diff --exit-code -- src/gen

            - name: Check SDK
              run: bun run ci

            - name: Create release pull request or publish to npm
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
              with:
                  commit-message: "chore(release): version polyester sdk"
                  pr-title: "chore(release): version polyester sdk"
                  version-script: bun run version-packages
                  publish-script: bun run release
                  create-github-releases: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
              env:
                  # The changelog generator reads PR links with this token.
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    devnet:
        name: Publish devnet snapshot
        needs: release
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version-file: .node-version
                  registry-url: https://registry.npmjs.org

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Pending changesets → 0.x.0-devnet-<datetime> on the `devnet` dist-tag; `latest` stays put.
            - name: Publish snapshot to the devnet dist-tag
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if ! ls .changeset/*.md >/dev/null 2>&1; then
                      echo "No pending changesets; nothing to snapshot"
                      exit 0
                  fi
                  bunx changeset version --snapshot devnet
                  bunx changeset publish --tag devnet --no-git-tag

                  # One rolling prerelease per target version (v0.33.0-devnet), moved to each new snapshot.
                  # Prerelease so `Latest` stays on the real release; notes are the snapshot's CHANGELOG section.
                  VERSION=$(node -p 'require("./package.json").version')
                  TAG="v${VERSION%%-devnet*}-devnet"
                  awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > devnet-notes.md
                  gh release delete "$TAG" --cleanup-tag --yes || true
                  gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
                      --title "v$VERSION" --notes-file devnet-notes.md

                  # Drop devnet releases orphaned by a mid-cycle target bump (0.32.2-devnet → 0.33.0-devnet):
                  # not the current tag and their version never shipped. Shipped cycles keep theirs.
                  # ponytail: scans the newest 100 releases; strays are always recent.
                  gh release list --limit 100 --json tagName --jq '.[].tagName | select(endswith("-devnet"))' |
                      while read -r OLD; do
                          [ "$OLD" = "$TAG" ] && continue
                          gh release view "${OLD%-devnet}" >/dev/null 2>&1 && continue
                          gh release delete "$OLD" --cleanup-tag --yes
                      done
